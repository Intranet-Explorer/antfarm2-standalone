<svg width="880" height="560" viewBox="0 0 880 560" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="880" height="560" fill="#020617"/>
  <rect width="880" height="560" fill="url(#grid)"/>

  <!-- ============ ARROWS (drawn first, sit behind boxes) ============ -->
  <!-- Harness <-> Ollama (bidirectional model calls) -->
  <path d="M 210 120 L 210 165" stroke="#34d399" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 240 165 L 240 120" stroke="#34d399" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Harness -> Workspace files (read/write) -->
  <path d="M 130 200 C 60 220, 60 280, 100 320" stroke="#a78bfa" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Harness -> SQLite (log events) -->
  <path d="M 320 200 C 400 220, 400 280, 360 320" stroke="#fb923c" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Dashboard <- SQLite (read) -->
  <path d="M 360 380 C 400 420, 500 440, 590 420" stroke="#fb923c" stroke-width="1.5" fill="none" marker-end="url(#arrowAmber)"/>

  <!-- Dashboard -> Browser (serves live view) -->
  <path d="M 700 400 L 780 400" stroke="#22d3ee" stroke-width="1.5" fill="none" marker-end="url(#arrowCyan)"/>

  <!-- Agent A <-> Agent B messaging (via harness, shown as dashed loop) -->
  <path d="M 140 90 C 170 60, 250 60, 280 90" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ SECURITY-GROUP-STYLE BOUNDARY: the "harness" runtime ============ -->
  <rect x="60" y="60" width="380" height="360" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="76" y="78" fill="#fbbf24" font-size="9" letter-spacing="1">STANDALONE HARNESS RUNTIME</text>

  <!-- Agent A -->
  <rect x="100" y="70" width="140" height="50" rx="6" fill="#0f172a"/>
  <rect x="100" y="70" width="140" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="170" y="90" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="600">Agent A</text>
  <text x="170" y="104" fill="#94a3b8" font-size="8" text-anchor="middle">model 1 · shift loop</text>

  <!-- Agent B -->
  <rect x="240" y="70" width="140" height="50" rx="6" fill="#0f172a"/>
  <rect x="240" y="70" width="140" height="50" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="310" y="90" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="600">Agent B</text>
  <text x="310" y="104" fill="#94a3b8" font-size="8" text-anchor="middle">model 2 · shift loop</text>

  <!-- harness.py core -->
  <rect x="130" y="165" width="180" height="55" rx="6" fill="#0f172a"/>
  <rect x="130" y="165" width="180" height="55" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="220" y="188" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="600">harness.py</text>
  <text x="220" y="202" fill="#94a3b8" font-size="8" text-anchor="middle">turn-taking · tools · loop guard</text>

  <!-- Workspace files -->
  <rect x="70" y="320" width="130" height="60" rx="6" fill="#0f172a"/>
  <rect x="70" y="320" width="130" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="135" y="343" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">Shared workspace</text>
  <text x="135" y="357" fill="#94a3b8" font-size="8" text-anchor="middle">files agents read/write</text>
  <text x="135" y="369" fill="#94a3b8" font-size="8" text-anchor="middle">(the only shared state)</text>

  <!-- SQLite -->
  <rect x="290" y="320" width="130" height="60" rx="6" fill="#0f172a"/>
  <rect x="290" y="320" width="130" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="355" y="343" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">state.db</text>
  <text x="355" y="357" fill="#94a3b8" font-size="8" text-anchor="middle">SQLite: shifts, events,</text>
  <text x="355" y="369" fill="#94a3b8" font-size="8" text-anchor="middle">reasoning, tool calls</text>

  <!-- ============ EXTERNAL: model backend ============ -->
  <rect x="470" y="70" width="150" height="50" rx="6" fill="#0f172a"/>
  <rect x="470" y="70" width="150" height="50" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="545" y="90" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="600">Ollama</text>
  <text x="545" y="104" fill="#94a3b8" font-size="8" text-anchor="middle">local model server (pluggable)</text>
  <path d="M 470 95 L 440 130" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arrow)" stroke-dasharray="3,3"/>

  <!-- ============ DASHBOARD ============ -->
  <rect x="590" y="370" width="110" height="60" rx="6" fill="#0f172a"/>
  <rect x="590" y="370" width="110" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="645" y="393" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">server.py</text>
  <text x="645" y="407" fill="#94a3b8" font-size="8" text-anchor="middle">stdlib http.server</text>
  <text x="645" y="419" fill="#94a3b8" font-size="8" text-anchor="middle">JSON API</text>

  <!-- Browser -->
  <rect x="780" y="370" width="80" height="60" rx="6" fill="#0f172a"/>
  <rect x="780" y="370" width="80" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="820" y="396" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">Live</text>
  <text x="820" y="409" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="600">viewer</text>
  <text x="820" y="422" fill="#94a3b8" font-size="8" text-anchor="middle">:8765</text>

  <!-- ============ Legend ============ -->
  <g transform="translate(60, 470)">
    <text x="0" y="0" fill="#64748b" font-size="9" letter-spacing="1">LEGEND</text>
    <rect x="0" y="12" width="14" height="9" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="20" y="20" fill="#94a3b8" font-size="9">agent / interface</text>
    <rect x="150" y="12" width="14" height="9" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
    <text x="170" y="20" fill="#94a3b8" font-size="9">runtime / server</text>
    <rect x="300" y="12" width="14" height="9" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
    <text x="320" y="20" fill="#94a3b8" font-size="9">shared state</text>
    <rect x="440" y="12" width="14" height="9" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
    <text x="460" y="20" fill="#94a3b8" font-size="9">external / pluggable</text>
    <path d="M 600 16 L 618 16" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="624" y="20" fill="#94a3b8" font-size="9">inter-agent message</text>
  </g>

  <text x="60" y="45" fill="#e2e8f0" font-size="15" font-weight="700" letter-spacing="0.5">antfarm2 — architecture</text>
  <text x="60" y="530" fill="#475569" font-size="8">Agents, model, and shift cadence are swappable per experiment. The harness + dashboard pairing is the reusable core.</text>
</svg>
